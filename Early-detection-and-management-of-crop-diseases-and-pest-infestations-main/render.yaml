services:
  - type: web
    name: leaflens-backend
    runtime: python
    rootDir: Early-detection-and-management-of-crop-diseases-and-pest-infestations-main/backend
    pythonVersion: "3.11.8"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
